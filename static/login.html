<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود - VCR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.2.8/400.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-blue-600">پروژه VCR</h1>
                <p class="text-sm text-gray-400 mt-1">سیستم استخراج داده‌های کوهرت با هوش مصنوعی</p>
            </div>

            <h2 class="text-xl font-bold text-gray-800 mb-1">ورود به داشبورد</h2>
            <p class="text-sm text-gray-400 mb-6">کد ملی خود را وارد کنید</p>

            <form id="login-form" class="space-y-4" novalidate>
                <div>
                    <label for="login-national" class="block text-xs font-bold text-gray-500 mb-1.5">کد ملی</label>
                    <input id="login-national" type="text" inputmode="numeric" maxlength="10" placeholder="کد ملی (۱۰ رقم)"
                           class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-white transition-all font-mono" dir="ltr">
                </div>
                <p id="login-error" class="text-sm text-red-500 hidden"></p>
                <button type="submit" id="login-btn"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                    ورود
                </button>
            </form>

            <div class="text-center text-sm mt-6 space-y-2">
                <p class="text-gray-400">
                    حساب ندارید؟
                    <a href="/signup" class="text-blue-600 hover:text-blue-700 font-bold">ثبت‌نام</a>
                </p>
                <p>
                    <a href="/signup" class="text-blue-600 hover:text-blue-700 font-bold">رفتن به صفحه ثبت‌نام</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // If already logged in, redirect to dashboard
            const saved = localStorage.getItem('vcr_user');
            if (saved) {
                try {
                    const userData = JSON.parse(saved);
                    if (userData && userData.user_id) {
                        window.location.href = '/dashboard';
                        return;
                    }
                } catch {}
            }

            document.getElementById('login-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const errEl = document.getElementById('login-error');
                const btn = document.getElementById('login-btn');
                const national = document.getElementById('login-national').value.trim();

                if (!national) {
                    errEl.textContent = 'کد ملی الزامی است.';
                    errEl.classList.remove('hidden');
                    return;
                }

                btn.disabled = true;
                btn.textContent = 'در حال ورود...';
                try {
                    const res = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ national_code: national }),
                    });
                    const data = await res.json();

                    if (data.error) {
                        errEl.textContent = data.error;
                        errEl.classList.remove('hidden');
                        return;
                    }

                    localStorage.setItem('vcr_user', JSON.stringify(data.user));
                    window.location.href = '/dashboard';
                } catch (err) {
                    console.error('Login failed:', err);
                    errEl.textContent = 'ارتباط با سرور با مشکل مواجه شد.';
                    errEl.classList.remove('hidden');
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'ورود';
                }
            });
        });
    </script>
</body>
</html>
