<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - VCR</title>
    <script src="/cdn/tailwindcss"></script>
    <link href="/cdn/vazirmatn" rel="stylesheet">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .sidebar-item {
            transition: all 0.3s ease;
        }
        .sidebar-item:hover {
            background-color: #f3f4f6;
            transform: translateX(-5px);
        }
        .sidebar-item.active {
            background-color: #3b82f6;
            color: white;
        }
        .stat-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-80 bg-white shadow-lg flex flex-col">
            <div class="p-6 border-b">
                <h1 class="text-2xl font-bold text-blue-600">پنل مدیریت</h1>
                <p class="text-xs text-gray-400 mt-1">سیستم کوهرت VCR</p>
            </div>
            
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" onclick="showSection('dashboard'); return false;" class="sidebar-item active block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="dashboard">
                    <span class="ml-3">📊</span> داشبورد
                </a>
                <a href="#" onclick="showSection('submissions'); return false;" class="sidebar-item block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="submissions">
                    <span class="ml-3">📋</span> پرسشنامه‌ها
                </a>
                <a href="#" onclick="showSection('users'); return false;" class="sidebar-item block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="users">
                    <span class="ml-3">👥</span> کاربران
                </a>
                <a href="#" onclick="showSection('questions'); return false;" class="sidebar-item block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="questions">
                    <span class="ml-3">❓</span> مدیریت سوالات
                </a>
                <a href="#" onclick="showSection('api-logs'); return false;" class="sidebar-item block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="api-logs">
                    <span class="ml-3">🤖</span> لاگ‌های هوش مصنوعی
                </a>
                <a href="#" onclick="showSection('settings'); return false;" class="sidebar-item block px-4 py-3 rounded-xl text-gray-700 font-medium" data-section="settings">
                    <span class="ml-3">⚙️</span> تنظیمات
                </a>
            </nav>
            
            <div class="p-4 border-t">
                <a href="/" class="block px-4 py-3 rounded-xl text-gray-600 hover:bg-gray-100 transition">
                    <span class="ml-3">🏠</span> بازگشت به سایت اصلی
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <div id="content-area" class="p-8">
                <!-- Dashboard will load here -->
                <div class="text-center py-20">
                    <svg class="animate-spin h-10 w-10 mx-auto mb-4" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <p class="text-gray-500">در حال بارگذاری...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/admin.js"></script>
</body>
</html>
